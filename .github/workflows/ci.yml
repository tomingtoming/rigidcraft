name: ci
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # native tests, the generated bindings (d.ts, state layout, exported functions) included
      - run: cargo test --release --features tools
        working-directory: core
  test:
    # pinned: on the 26.04 image behind ubuntu-latest, apt could not resolve the Ubuntu mirrors for the browsers' packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      - run: bun x playwright install --with-deps chromium firefox webkit
        timeout-minutes: 10 # apt has retried without end when the runner could not resolve the package mirrors
      - run: bun run test:plane
        timeout-minutes: 2
      - run: bun run test:editor:scale
        timeout-minutes: 2
      - run: bun run test:editor
        timeout-minutes: 10
      - name: Ground terrain and braking
        run: node tools/editor-ci.mjs terrain-ground
        timeout-minutes: 5
      - name: Inlet, raft and measured water runs
        run: node tools/editor-ci.mjs terrain-water
        timeout-minutes: 5
      - name: Flight courses and navigation
        run: node tools/editor-ci.mjs terrain-flight
        timeout-minutes: 5
      - run: bun run test:editor:firefox
        timeout-minutes: 3
      - run: bun run test:editor:webkit
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: editor-screenshots
          path: .shots/*.png
